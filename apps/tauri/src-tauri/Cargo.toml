[package]
name = "tensamin"
version = "0.0.0"
description = "Privacy focused messanger"
authors = ["nonanium"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { git = "https://github.com/tauri-apps/tauri", rev = "4af26a3f7f8b692d62cca549bbacd93f5ce90b41", features = [] }

[dependencies]
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tau-relay-protocol = { git = "https://github.com/TensaminDev/Tau.git", rev = "ccbdcb81df00d626da16071c4c8b0b1ec803f87c" }
base64 = "0.23"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
mtp = { path = "../../../../../mtp", features = ["client", "crypto"] }
tauri-plugin-mtp = { path = "../../../../../mtp/plugins/tauri", features = ["tauri", "mobile"] }
tauri-plugin-deep-link = "2"
tauri-plugin-notification = "2"
tauri-plugin-log = "2"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"
rusqlite = { version = "0.40", features = ["bundled"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
keyring-core = "1"
getrandom = "0.4"

[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
zbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain", "protected"] }

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = "1"
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }

[target.'cfg(target_os = "android")'.dependencies.tauri]
version = "=2.11.5"
features = []
default-features = true

[target.'cfg(not(target_os = "android"))'.dependencies.tauri]
version = "=2.11.5"
features = []
default-features = true

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22"

[patch.crates-io.tauri]
git = "https://github.com/tauri-apps/tauri"
rev = "4af26a3f7f8b692d62cca549bbacd93f5ce90b41"

[patch."https://github.com/Nonanium/MTP.git"]
mtp = { path = "../../../../../mtp" }
mtp-type-map = { path = "../../../../../mtp/type-map" }
mtp-crypto = { path = "../../../../../mtp/crypto" }
