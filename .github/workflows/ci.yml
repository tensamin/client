name: Verification

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tensamin/client
    strategy:
      matrix:
        channel: [stable, canary, dev]
    env:
      TENSAMIN_CHANNEL: ${{ matrix.channel }}
      TENSAMIN_ANDROID_VERSION_CODE: ${{ github.run_number }}
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          path: tensamin/client
      - name: Read locked MTP revision
        id: mtp
        run: jq -er '"revision=\(.nodes["mtp-src"].locked.rev)"' flake.lock >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: nonanium/mtp
          ref: ${{ steps.mtp.outputs.revision }}
          path: mtp
      - uses: cachix/install-nix-action@v31
      - run: nix develop .#electron --command pnpm run build:sdk
      - run: git submodule update --init --recursive
      - run: nix develop .#electron --command pnpm install --frozen-lockfile
      - run: nix develop .#electron --command pnpm run ci

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tensamin/client
    strategy:
      matrix:
        channel: [stable, canary, dev]
    env:
      TENSAMIN_CHANNEL: ${{ matrix.channel }}
      TENSAMIN_ANDROID_VERSION_CODE: ${{ github.run_number }}
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          path: tensamin/client
      - name: Read locked MTP revision
        id: mtp
        run: jq -er '"revision=\(.nodes["mtp-src"].locked.rev)"' flake.lock >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: nonanium/mtp
          ref: ${{ steps.mtp.outputs.revision }}
          path: mtp
      - uses: cachix/install-nix-action@v31
      - run: nix develop .#tauri --command pnpm run build:sdk
      - run: git submodule update --init --recursive
      - run: nix develop .#tauri --command pnpm install --frozen-lockfile
      - name: Check shared renderer delivery and lifecycle contracts
        run: nix develop .#tauri --command pnpm run test
      - run: nix develop .#tauri --command pnpm --dir apps/tauri run build:mobile:ci

  native:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tensamin/client
    steps:
      - uses: actions/checkout@v4
        with:
          path: tensamin/client
      - name: Read locked MTP revision
        id: mtp
        run: jq -er '"revision=\(.nodes["mtp-src"].locked.rev)"' flake.lock >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: nonanium/mtp
          ref: ${{ steps.mtp.outputs.revision }}
          path: mtp
      - uses: cachix/install-nix-action@v31
      - run: git submodule update --init --recursive
      - run: nix develop .#native --command pnpm install --frozen-lockfile
      - run: nix develop .#native --command pnpm run gen-icons
      - run: nix develop .#native --command cargo test --locked --manifest-path apps/tauri/src-tauri/Cargo.toml
      - run: nix develop .#native --command cargo clippy --locked --manifest-path apps/tauri/src-tauri/Cargo.toml --all-targets -- -D warnings
